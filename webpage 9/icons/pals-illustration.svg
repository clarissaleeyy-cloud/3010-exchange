<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="a round little seal and a plump penguin sitting together on an ice floe">

  <!-- ───── ice floe ───── -->
  <ellipse cx="120" cy="104" rx="108" ry="15" fill="#dde5ef" opacity="0.85"/>
  <ellipse cx="120" cy="101" rx="106" ry="11" fill="#f4f8fc"/>
  <path d="M22 101 Q60 96 100 100 Q140 104 178 99 Q206 96 222 101" stroke="#cfdcea" stroke-width="1.4" fill="none" opacity="0.8"/>

  <!-- ───── seal (original design: round, soft, big-eyed) ───── -->
  <g transform="translate(126,30)">
    <!-- tail fluke behind the body -->
    <path d="M42 62 C54 56 64 56 74 62 C64 64 56 68 44 68 Z" fill="#94a4bd"/>
    <path d="M42 62 C54 58 62 58 70 61" stroke="#7f90ab" stroke-width="1" fill="none"/>

    <!-- body -->
    <ellipse cx="30" cy="52" rx="30" ry="21" fill="#aebccf"/>
    <ellipse cx="30" cy="57" rx="21" ry="13" fill="#e8eef6"/>

    <!-- front flippers -->
    <ellipse cx="10" cy="63" rx="10" ry="5.5" fill="#9dacc3" transform="rotate(-14 10 63)"/>
    <ellipse cx="50" cy="63" rx="10" ry="5.5" fill="#9dacc3" transform="rotate(14 50 63)"/>

    <!-- head -->
    <ellipse cx="30" cy="24" rx="21" ry="19" fill="#aebccf"/>
    <ellipse cx="30" cy="30" rx="13" ry="10.5" fill="#e8eef6"/>

    <!-- rosy cheeks -->
    <ellipse cx="14" cy="30" rx="5" ry="3.4" fill="#e8a79a" opacity="0.55"/>
    <ellipse cx="46" cy="30" rx="5" ry="3.4" fill="#e8a79a" opacity="0.55"/>

    <!-- eyes -->
    <ellipse cx="21" cy="20" rx="4.4" ry="5" fill="#232a44"/>
    <ellipse cx="39" cy="20" rx="4.4" ry="5" fill="#232a44"/>
    <circle cx="22.6" cy="18" r="1.6" fill="#ffffff"/>
    <circle cx="40.6" cy="18" r="1.6" fill="#ffffff"/>
    <circle cx="19.6" cy="22.4" r="0.8" fill="#ffffff" opacity="0.75"/>
    <circle cx="37.6" cy="22.4" r="0.8" fill="#ffffff" opacity="0.75"/>

    <!-- nose + smile -->
    <path d="M26.5 28.5 Q30 26.5 33.5 28.5 Q30 31.6 26.5 28.5 Z" fill="#5d6b85"/>
    <path d="M30 31 L30 33.5" stroke="#5d6b85" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M30 33.5 Q25.5 37 22 33.6" stroke="#5d6b85" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M30 33.5 Q34.5 37 38 33.6" stroke="#5d6b85" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- whiskers -->
    <path d="M17 29 L5 26" stroke="#6f7d95" stroke-width="1" stroke-linecap="round"/>
    <path d="M17 32 L5 32" stroke="#6f7d95" stroke-width="1" stroke-linecap="round"/>
    <path d="M43 29 L55 26" stroke="#6f7d95" stroke-width="1" stroke-linecap="round"/>
    <path d="M43 32 L55 32" stroke="#6f7d95" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- ───── penguin (original design: plump, soft, friendly) ───── -->
  <g transform="translate(34,34)">
    <!-- feet -->
    <ellipse cx="17" cy="66" rx="7" ry="3.6" fill="#e0982f"/>
    <ellipse cx="37" cy="66" rx="7" ry="3.6" fill="#e0982f"/>

    <!-- body -->
    <ellipse cx="27" cy="44" rx="24" ry="25" fill="#3c4763"/>
    <ellipse cx="27" cy="48" rx="16" ry="19" fill="#f6f1e2"/>

    <!-- flippers -->
    <ellipse cx="4" cy="44" rx="6" ry="14" fill="#333d57" transform="rotate(12 4 44)"/>
    <ellipse cx="50" cy="44" rx="6" ry="14" fill="#333d57" transform="rotate(-12 50 44)"/>

    <!-- head -->
    <ellipse cx="27" cy="20" rx="21" ry="19.5" fill="#3c4763"/>
    <!-- face patch -->
    <path d="M27 3 C15 3 8 12 8 21 C8 30 16 38 27 38 C38 38 46 30 46 21 C46 12 39 3 27 3 Z" fill="#3c4763"/>
    <ellipse cx="27" cy="25" rx="15" ry="13" fill="#f6f1e2"/>

    <!-- eyes -->
    <ellipse cx="20" cy="20" rx="4.6" ry="5.2" fill="#232a44"/>
    <ellipse cx="34" cy="20" rx="4.6" ry="5.2" fill="#232a44"/>
    <circle cx="21.6" cy="18" r="1.7" fill="#ffffff"/>
    <circle cx="35.6" cy="18" r="1.7" fill="#ffffff"/>
    <circle cx="18.6" cy="22.4" r="0.8" fill="#ffffff" opacity="0.75"/>
    <circle cx="32.6" cy="22.4" r="0.8" fill="#ffffff" opacity="0.75"/>

    <!-- rosy cheeks -->
    <ellipse cx="13" cy="27" rx="4.4" ry="3" fill="#e8a79a" opacity="0.5"/>
    <ellipse cx="41" cy="27" rx="4.4" ry="3" fill="#e8a79a" opacity="0.5"/>

    <!-- beak -->
    <path d="M22 29 Q27 26 32 29 Q27 34.5 22 29 Z" fill="#e0982f"/>
    <path d="M22.6 29.6 Q27 31.4 31.4 29.6" stroke="#c07f21" stroke-width="0.9" fill="none"/>

    <!-- little scarf, tying the two together -->
    <path d="M9 38 Q27 46 45 38 L45 44 Q27 52 9 44 Z" fill="#d9a548"/>
    <path d="M43 43 L52 55 L45 56 L40 46 Z" fill="#c98f2e"/>
  </g>

  <!-- a small heart floating between them -->
  <path d="M104 24 C104 20.5 109 20 110.5 23 C112 20 117 20.5 117 24 C117 28 110.5 33 110.5 33 C110.5 33 104 28 104 24 Z" fill="#e2a37f" opacity="0.85"/>
</svg>
